[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "race-dengue"
version = "0.2.0"
description = "Reliability-Aware Counterfactual AI for Evaluating Dengue-Control Interventions Using Multi-Site Surveillance Data"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<4", "scipy>=1.12,<2",
  "statsmodels>=0.14,<0.16", "scikit-learn>=1.4,<2",
  "pydantic>=2.6,<3", "pyyaml>=6,<7", "joblib>=1.3,<2", "threadpoolctl>=3.1,<4",
  "matplotlib>=3.8,<4", "xlrd>=2.0.1,<3", "openpyxl>=3.1,<4", "certifi>=2024.2.2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
ui = ["plotly>=5,<7", "streamlit>=1.35,<2"]
api = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1"]

[project.scripts]
race-dengue = "src.pipeline.evaluate:main"

[tool.setuptools.packages.find]
include = ["src*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["real_data: requires the verified public Niteroi source file"]
